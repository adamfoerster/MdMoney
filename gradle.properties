# The app version (SemVer) — the single source of truth for every target. Android's versionName,
# the desktop package, and the generated AppVersion all derive from it; CHANGELOG.md's top entry and
# the iOS MARKETING_VERSION must agree with it, which VersionTest enforces. Bump it with every
# user-facing change (see CLAUDE.md).
mdmoney.version=0.4.1

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

# Compose Hot Reload (`./gradlew :composeApp:hotRunJvm`) runs the desktop app on a **JetBrains
# Runtime**: redefining a class while the app is running is a JBR feature, so no ordinary JDK will
# do. The plugin looks for JBR 21 (`compose.reload.jbr.version`, its default, and what this build
# targets) and, finding only Temurin, fails with "Failed to find suitable JetBrains Runtime 21".
# Its fallback — Gradle's own toolchain provisioning — can't help either, because this build
# declares no toolchain download repository. So let the plugin fetch the JBR itself; it downloads
# once and is cached. Only hot reload uses it: every compile still runs on the toolchain JDK.
compose.reload.jbr.autoProvisioningEnabled=true

android.useAndroidX=true
android.nonTransitiveRClass=true
